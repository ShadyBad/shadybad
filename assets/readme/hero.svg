<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Brandon Shay — AI Engineer</title>
  <desc id="desc">AI Engineer Brandon Shay builds production GenAI systems that earn their autonomy, shown beside his agent loop: typed input, the agent proposes, an eval gate scores it, a human approves, the engineer commits, and every action stays reversible.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0D1B26"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="23.5" fill="none" stroke="#1E293B"/>

  <!-- Title block -->
  <g transform="translate(64 66)">
    <rect x="0" y="4" width="34" height="2" rx="1" fill="#14B8A6"/>
    <text x="46" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#14B8A6">AI ENGINEER</text>
    <text x="0" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="66" font-weight="700" fill="#F8FAFC">Brandon Shay</text>

    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#CBD5E1">I build production GenAI systems</text>
    <text x="0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="500" fill="#CBD5E1">that earn their autonomy<tspan fill="#14B8A6">.</tspan></text>

    <text x="0" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748B">evals · types · human-in-the-loop</text>

    <text x="0" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" letter-spacing="1" fill="#475569">ENTERPRISE IT → AI ENGINEERING · ORANGE COUNTY, CA</text>
  </g>

  <!-- Proof: the agent loop — propose, gate, approve, commit, reversible -->
  <g transform="translate(724 60)">
    <text x="0" y="6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5" fill="#64748B">AGENT LOOP</text>
    <g transform="translate(412 -6)">
      <circle cx="-90" cy="1.5" r="3" fill="#14B8A6"/>
      <text x="0" y="6" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#14B8A6">eval-gated</text>
    </g>

    <!-- stages (animated group) -->
    <g id="pipeline" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <!-- input -->
      <rect x="0" y="26" width="412" height="40" rx="9" fill="#0E1B2A" stroke="#14B8A6" stroke-opacity="0.55"/>
      <text x="18" y="51" fill="#5EEAD4">typed input</text>
      <text x="394" y="51" text-anchor="end" fill="#475569">Pydantic</text>
      <line x1="206" y1="66" x2="206" y2="80" stroke="#334155" stroke-width="1.6"/>
      <path d="M201 78 L206 84 L211 78 Z" fill="#334155"/>

      <rect x="30" y="84" width="352" height="38" rx="9" fill="#111C2B" stroke="#1E293B"/>
      <text x="48" y="108" fill="#CBD5E1">agent proposes</text>
      <text x="364" y="108" text-anchor="end" fill="#475569">Claude API</text>
      <line x1="206" y1="122" x2="206" y2="136" stroke="#334155" stroke-width="1.6"/>
      <path d="M201 134 L206 140 L211 134 Z" fill="#334155"/>

      <rect x="30" y="140" width="352" height="38" rx="9" fill="#111C2B" stroke="#1E293B"/>
      <text x="48" y="164" fill="#CBD5E1">eval gate</text>
      <text x="364" y="164" text-anchor="end" fill="#475569">LLM-as-Judge</text>
      <line x1="206" y1="178" x2="206" y2="192" stroke="#334155" stroke-width="1.6"/>
      <path d="M201 190 L206 196 L211 190 Z" fill="#334155"/>

      <rect x="30" y="196" width="352" height="38" rx="9" fill="#111C2B" stroke="#1E293B"/>
      <text x="48" y="220" fill="#CBD5E1">human approves</text>
      <text x="364" y="220" text-anchor="end" fill="#475569">HITL</text>
      <line x1="206" y1="234" x2="206" y2="248" stroke="#334155" stroke-width="1.6"/>
      <path d="M201 246 L206 252 L211 246 Z" fill="#334155"/>

      <rect x="30" y="252" width="352" height="38" rx="9" fill="#111C2B" stroke="#1E293B"/>
      <text x="48" y="276" fill="#CBD5E1">engineer commits</text>
      <text x="364" y="276" text-anchor="end" fill="#475569">typed · traced</text>
      <line x1="206" y1="290" x2="206" y2="304" stroke="#334155" stroke-width="1.6"/>
      <path d="M201 302 L206 308 L211 302 Z" fill="#334155"/>

      <!-- output -->
      <rect x="0" y="308" width="412" height="40" rx="9" fill="#1C1608" stroke="#F59E0B" stroke-opacity="0.6"/>
      <text x="18" y="333" fill="#FBBF24">reversible</text>
      <text x="394" y="333" text-anchor="end" fill="#B45309">undo path</text>
    </g>
  </g>
</svg>
